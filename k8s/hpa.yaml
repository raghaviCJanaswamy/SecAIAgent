# Horizontal Pod Autoscaler — scale 2-5 replicas based on CPU load.
# Agent runs are CPU-bound (LLM calls + GitHub API). Scale up when avg CPU > 60%.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: xray-agent
  namespace: xray-agent
  labels:
    app.kubernetes.io/name: xray-agent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: xray-agent
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # wait 5 min before scaling down
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
