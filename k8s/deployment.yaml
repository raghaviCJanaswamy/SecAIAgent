apiVersion: apps/v1
kind: Deployment
metadata:
  name: xray-agent
  namespace: xray-agent
  labels:
    app.kubernetes.io/name: xray-agent
    app.kubernetes.io/version: "2.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: xray-agent
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xray-agent
        app.kubernetes.io/version: "2.0.0"
    spec:
      serviceAccountName: xray-agent
      automountServiceAccountToken: false

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: xray-agent

      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: xray-agent
          # Replace with your ECR image URI:
          # image: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/xray-agent:2.0.0
          image: xray-agent:2.0.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          # Non-sensitive config from ConfigMap
          envFrom:
            - configMapRef:
                name: xray-agent-config

          # Secrets injected individually
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: xray-agent-secrets
                  key: GITHUB_TOKEN
            - name: XRAY_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: xray-agent-secrets
                  key: XRAY_WEBHOOK_SECRET
            - name: JFROG_URL
              valueFrom:
                secretKeyRef:
                  name: xray-agent-secrets
                  key: JFROG_URL
            - name: JFROG_USERNAME
              valueFrom:
                secretKeyRef:
                  name: xray-agent-secrets
                  key: JFROG_USERNAME
            - name: JFROG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: xray-agent-secrets
                  key: JFROG_PASSWORD

          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}

      terminationGracePeriodSeconds: 30
