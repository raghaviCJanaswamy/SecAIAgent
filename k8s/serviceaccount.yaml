# Dedicated ServiceAccount — no default automounting of credentials.
# On EKS, attach an IAM role via IRSA annotation if the agent needs AWS resources
# (e.g. ECR pull, Secrets Manager). No Bedrock permissions are granted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: xray-agent
  namespace: xray-agent
  labels:
    app.kubernetes.io/name: xray-agent
  # Uncomment and set your IRSA role ARN if needed for ECR / Secrets Manager:
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/xray-agent-irsa
automountServiceAccountToken: false
